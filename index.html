<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#0d0f14; --panel:#14171f; --panel-edge:#232732;
    --blue:#3f6fa8; --blue2:#5c7f9e; --steel:#7c8698;
    --ink:#e7eaf0; --ink-soft:#727c8c; --line:#252a35;
    --font-ui:'Space Grotesk', system-ui, sans-serif;
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:var(--font-ui); display:flex; flex-direction:column;
  }
  header{
    padding:22px 30px; border-bottom:4px double var(--blue2);
    display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  }
  header h1{
    margin:0; font-family:'Playfair Display', serif; font-weight:800;
    font-size:1.5rem; letter-spacing:.02em; color:var(--ink);
  }
  header span{
    color:var(--ink-soft); font-size:.72rem; text-transform:uppercase;
    letter-spacing:.24em;
  }
  .app{display:flex; flex:1; flex-wrap:wrap;}

  .stage{
    flex:3 1 480px; min-width:320px; position:relative;
    padding:40px; display:flex; align-items:stretch;
    border-right:1px solid var(--line);
  }
  .rail-frame{ position:relative; flex:1; display:flex; }
  .rail-frame::before, .rail-frame::after{
    content:''; position:absolute; inset:8px; pointer-events:none; z-index:2;
  }
  .rail-frame::before{ inset:8px; border:1px solid rgba(231,234,240,.6); }
  .rail-frame::after{ inset:13px; border:1px solid rgba(92,127,158,.35); }
  .rail-d{
    position:absolute; width:10px; height:10px; z-index:3;
    background:var(--blue); border:2px solid var(--bg);
    transform:translate(-50%,-50%) rotate(45deg);
    box-shadow:0 0 0 1px rgba(231,234,240,.5);
  }
  .rail-d.tl{top:8px; left:8px;} .rail-d.tr{top:8px; left:calc(100% - 8px);}
  .rail-d.bl{top:calc(100% - 8px); left:8px;} .rail-d.br{top:calc(100% - 8px); left:calc(100% - 8px);}

  #editor{
    flex:1; margin:24px; outline:none; overflow:auto;
    color:var(--ink); line-height:1.5; caret-color:var(--blue2);
  }
  #editor:empty:before{ content:attr(data-placeholder); color:var(--ink-soft); }

  .side{
    flex:1 1 300px; min-width:280px; padding:30px 28px;
    display:flex; flex-direction:column; gap:24px; overflow:auto;
  }
  .group-title{
    display:flex; align-items:center; gap:10px;
    text-transform:uppercase; letter-spacing:.26em; font-size:.66rem;
    color:var(--ink-soft); margin-bottom:12px;
  }
  .group-title::before{ content:''; width:6px; height:6px; background:var(--blue); transform:rotate(45deg); flex:none; }
  .group-title::after{ content:''; flex:1; height:3px; border-top:1px solid var(--blue); border-bottom:1px solid var(--blue2); }

  select, input[type=range]{ width:100%; }
  select{
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    padding:9px 10px; font-family:var(--font-ui); font-size:.85rem;
  }
  .row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .row .val{ color:var(--blue2); font-size:.72rem; font-variant-numeric:tabular-nums; }
  input[type=range]{
    -webkit-appearance:none; height:2px; background:var(--line); outline:none;
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; background:var(--blue);
    border:2px solid var(--bg); box-shadow:0 0 0 1px var(--blue2); transform:rotate(45deg); cursor:pointer;
  }
  input[type=range]::-moz-range-thumb{
    width:11px; height:11px; background:var(--blue); border:2px solid var(--bg);
    box-shadow:0 0 0 1px var(--blue2); transform:rotate(45deg); cursor:pointer; border-radius:0;
  }

  .btn-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button.tool{
    --c:var(--blue2);
    border:1px solid var(--line); background:
      linear-gradient(var(--c),var(--c)) top left/8px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) top left/1px 8px no-repeat,
      linear-gradient(var(--c),var(--c)) top right/8px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) top right/1px 8px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left/8px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom left/1px 8px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right/8px 1px no-repeat,
      linear-gradient(var(--c),var(--c)) bottom right/1px 8px no-repeat,
      var(--panel);
    box-shadow:inset 0 0 0 3px var(--panel), inset 0 0 0 4px var(--panel-edge);
    color:var(--ink); font-family:var(--font-ui); font-size:.72rem;
    letter-spacing:.06em; padding:11px 8px; cursor:pointer;
  }
  button.tool:hover{ --c:#fff; }
  button.tool.active{ --c:var(--blue); background-color:rgba(63,111,168,.18); color:#fff; }
  button.reset{
    grid-column:1 / -1; background:transparent; border:1px solid var(--line);
    color:var(--ink-soft); font-size:.68rem; text-transform:uppercase;
    letter-spacing:.2em; padding:10px; cursor:pointer;
  }
  button.reset:hover{ color:var(--ink); border-color:var(--blue2); }

  @media (max-width:760px){
    .stage{ border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <h1>Casework</h1>
  <span>Font and text editor</span>
</header>

<div class="app">

      <div class="rail-d bl"></div><div class="rail-d br"></div>

        style="font-family:'Fraunces',serif; font-weight:500; font-size:26px; letter-spacing:0em;">The quick brown fox jumps over the lazy dog. Adjust the type on the right, then try the case buttons.</div>
    </div>
  </div>

  <div class="side">
    <div>

    <div>

      <div class="row"><span>100 – 900</span><span class="val" id="weightVal">500</span></div>
      <input type="range" id="weightRange" min="100" max="900" step="50" value="500">

        <button class="tool" id="btnItalic" style="font-style:italic;">Italic</button>

</div>

<script>
  const editor = document.getElementById('editor');
  const original = editor.textContent;

  const fontInput = document.getElementById('fontInput');
  const fontStatus = document.getElementById('fontStatus');
  const loadedFonts = new Set();
  const genericFallback = 'sans-serif';

  function loadGoogleFont(name){
    name = name.trim();
    if(!name) return;
    const family = name.replace(/\s+/g, '+');
    const fallbackFamily = `'${name}', ${genericFallback}`;
    if(loadedFonts.has(name)){
      editor.style.fontFamily = fallbackFamily;
      fontStatus.textContent = name;
      return;
    }
    fontStatus.textContent = 'Loading ' + name + '…';
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = `https://fonts.googleapis.com/css2?family=${family}:wght@100;200;300;400;500;600;700;800;900&display=swap`;
    link.onload = () => {
      loadedFonts.add(name);
      editor.style.fontFamily = fallbackFamily;
      fontStatus.textContent = name;
    };
    link.onerror = () => {
      fontStatus.textContent = `"${name}" not found on Google Fonts`;
    };
    document.head.appendChild(link);
  }
  fontInput.addEventListener('change', e => loadGoogleFont(e.target.value));
  loadGoogleFont(fontInput.value);
  const weightRange = document.getElementById('weightRange');
  const weightVal = document.getElementById('weightVal');
  weightRange.addEventListener('input', e=>{
    editor.style.fontWeight = e.target.value;
    weightVal.textContent = e.target.value;
  });
  const sizeRange = document.getElementById('sizeRange');
  const sizeVal = document.getElementById('sizeVal');
  sizeRange.addEventListener('input', e=>{
    editor.style.fontSize = e.target.value + 'px';
    sizeVal.textContent = e.target.value;
  });
  const spaceRange = document.getElementById('spaceRange');
  const spaceVal = document.getElementById('spaceVal');
  spaceRange.addEventListener('input', e=>{
    const em = (e.target.value/100).toFixed(2);
    editor.style.letterSpacing = em + 'em';
    spaceVal.textContent = em;
  });

  function ensureSelectionInEditor(){
    const sel = window.getSelection();
    const hasRangeInEditor = sel.rangeCount > 0 && editor.contains(sel.anchorNode) && !sel.isCollapsed;
    if(!hasRangeInEditor){
      // Nothing selected: apply the style to the whole editor content instead.
      const range = document.createRange();
      range.selectNodeContents(editor);
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
  function toggleStyle(command, btn){
    editor.focus();
    ensureSelectionInEditor();
    document.execCommand(command, false, null);
    syncStyleButtons();
  }
  function syncStyleButtons(){
    document.getElementById('btnItalic').classList.toggle('active', document.queryCommandState('italic'));
    document.getElementById('btnUnderline').classList.toggle('active', document.queryCommandState('underline'));
    document.getElementById('btnStrike').classList.toggle('active', document.queryCommandState('strikeThrough'));
  }
  document.getElementById('btnItalic').addEventListener('click', ()=> toggleStyle('italic'));
  document.getElementById('btnUnderline').addEventListener('click', ()=> toggleStyle('underline'));
  document.getElementById('btnStrike').addEventListener('click', ()=> toggleStyle('strikeThrough'));
  document.addEventListener('selectionchange', ()=>{
    const sel = window.getSelection();
    if(sel.rangeCount > 0 && editor.contains(sel.anchorNode)) syncStyleButtons();
  });

  function applyCase(fn){
    const text = editor.innerText;
    editor.innerText = fn(text);
  }
  document.getElementById('btnUpper').addEventListener('click', ()=> applyCase(s=>s.toUpperCase()));
  document.getElementById('btnLower').addEventListener('click', ()=> applyCase(s=>s.toLowerCase()));
  document.getElementById('btnCap').addEventListener('click', ()=> applyCase(s=>
    s.replace(/\S+/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
  ));
  const MINOR_WORDS = new Set(['a','an','and','as','at','but','by','for','if','in','nor','of','on','or','so','the','to','up','yet','vs','via']);
  document.getElementById('btnTitle').addEventListener('click', ()=> applyCase(s=>{
    const words = s.split(/(\s+)/);
    let wordIndex = -1;
    const lastWordIdx = (()=>{ let n=-1; words.forEach((w,i)=>{ if(/\S/.test(w)) n=i; }); return n; })();
    return words.map((w,i)=>{
      if(!/\S/.test(w)) return w;
      wordIndex++;
      const lower = w.toLowerCase();
      const bare = lower.replace(/^[^a-zA-Z]+|[^a-zA-Z]+$/g, '');
      const isMinor = MINOR_WORDS.has(bare) && wordIndex !== 0 && i !== lastWordIdx;
      if(isMinor) return lower;
      return lower.replace(/[a-zA-Z]/, c => c.toUpperCase());
    }).join('');
  }));
  function alternate(s, startUpper){
    let out=''; let i=0;
    for(const ch of s){
      if(/[a-zA-Z]/.test(ch)){
        const upperTurn = startUpper ? (i%2===0) : (i%2!==0);
        out += upperTurn ? ch.toUpperCase() : ch.toLowerCase();
        i++;
      } else out += ch;
    }
    return out;
  }
  document.getElementById('btnAlt').addEventListener('click', ()=> applyCase(s => alternate(s, false)));
  document.getElementById('btnAltInv').addEventListener('click', ()=> applyCase(s => alternate(s, true)));
  document.getElementById('btnReset').addEventListener('click', ()=>{ editor.innerText = original; });
</script>
</body>
